<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отправления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ea; --panel:#ffffff; --panel-2:#f8f7f2; --ink:#16161a; --muted:#6b6a66; --line:#e4e1d8;
  --accent:#f0d722; --accent-ink:#16161a; --ok:#1a8f4a; --warn:#c96a00; --bad:#c62828;
  --tram:#be1414; --bus:#a5027d; --subway:#115d91; --suburban:#008d4f; --regional:#e3000f; --night:#2b2b6e;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f12; --panel:#17181d; --panel-2:#1d1f25; --ink:#f2f1ec; --muted:#9a9a9f; --line:#2a2c33;
    --ok:#3ccf7a; --warn:#ffae3d; --bad:#ff5b5b; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f12; --panel:#17181d; --panel-2:#1d1f25; --ink:#f2f1ec; --muted:#9a9a9f; --line:#2a2c33;
  --ok:#3ccf7a; --warn:#ffae3d; --bad:#ff5b5b; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
h1{font-size:24px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-top:3px}
.clock{font-family:"JetBrains Mono",monospace;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.clock small{font-size:18px;color:var(--muted)}
.right{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
header{position:relative}
.lang{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;margin-bottom:8px}
.lang button{border:0;background:transparent;color:var(--muted);font:700 12px Inter,sans-serif;letter-spacing:.04em;padding:5px 9px;border-radius:7px;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
.lang button:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.dot.err{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px Inter,sans-serif;padding:7px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--ink)}
.label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}

.wx{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.wx-tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.wx-tile b{font-family:"JetBrains Mono",monospace;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wx-tile span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx-tile .wx-k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.wx-main{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
.wx-main > div{display:flex;flex-direction:column;min-width:0}
.wx-main b{font-size:28px;line-height:1.05}
.wx-tile .wx-ico{font-size:34px;line-height:1;overflow:visible;color:inherit;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
@media (max-width:700px){.wx{grid-template-columns:1fr 1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.card-head .lines{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.walk{flex:none;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:6px 10px;min-width:64px}
.walk b{display:block;font-size:20px;line-height:1.1;font-family:"JetBrains Mono",monospace}
.walk span{font-size:11px;font-weight:600}
.walk small{display:block;font-size:10px;opacity:.7}

table{width:100%;border-collapse:collapse}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px}
tr:last-child td{border-bottom:0}
td.l{width:62px;padding-right:0}
td.d{font-weight:600;max-width:0;width:100%}
td.d .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.d .s{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
td.m{text-align:right;white-space:nowrap;font-family:"JetBrains Mono",monospace}
td.m b{font-size:20px}
td.m .c{font-size:12px;color:var(--muted);display:block}
td.lv{text-align:right;white-space:nowrap;width:1%}
tr.missed td{opacity:.38}
tr.cancel td.d .t{text-decoration:line-through;color:var(--bad)}
.late{color:var(--warn);font-weight:700}
.ontime{color:var(--ok)}

.badge{display:inline-grid;place-items:center;min-width:44px;height:26px;padding:0 7px;border-radius:6px;color:#fff;font-weight:800;font-size:13px;letter-spacing:-.01em}
.badge.sm{min-width:34px;height:20px;font-size:11px;border-radius:5px;padding:0 5px}
.badge.tram{background:var(--tram)}
.badge.bus{background:var(--bus);border-radius:13px}
.badge.bus.sm{border-radius:10px}
.badge.subway{background:var(--subway)}
.badge.suburban{background:var(--suburban);border-radius:13px}
.badge.regional{background:var(--regional)}
.badge.night{background:var(--night)}

.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.pill.now{background:var(--bad);border-color:var(--bad);color:#fff;animation:blink 1s steps(2,start) infinite}
.pill.soon{background:rgba(201,106,0,.16);background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:var(--warn);color:var(--warn)}
.pill.ok{background:rgba(26,143,74,.14);border-color:rgba(26,143,74,.5);background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
@keyframes blink{to{opacity:.55}}
.empty,.err{padding:24px 16px;color:var(--muted);font-size:14px;text-align:center}
.skeleton{height:46px;margin:8px 16px;border-radius:8px;background:linear-gradient(90deg,var(--panel-2),var(--line),var(--panel-2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
footer{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.6}
footer a{color:inherit}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 13px Inter,sans-serif;cursor:pointer}

@media (max-width:560px){
  .clock{font-size:30px}
  h1{font-size:20px}
  td{padding:9px 12px;font-size:14px}
  td.m b{font-size:17px}
  td.m .pt, td.m .ontime{display:none}
  td.l{width:50px}
  .badge{min-width:38px}
  .right{text-align:left;align-items:flex-start}
  .lang{position:absolute;top:0;right:0;margin:0}
  .brand{padding-right:96px}
  .status{justify-content:flex-start}
}
@supports not (inset:0){
  .brand>*+*{margin-left:14px}
  .status>*+*{margin-left:6px}
  .controls>*{margin:0 10px 10px 0}
  .wx-main>*+*{margin-left:12px}
  .card-head>*+*{margin-left:12px}
  .lines>*{margin:0 4px 4px 0}
  .lang button+button{margin-left:2px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🚋</div>
      <div>
        <h1 data-i18n="title">Отправления 🏠</h1>
        <div class="sub" data-i18n="sub"></div>
      </div>
    </div>
    <div class="right">
      <div class="lang" role="group" aria-label="Язык / Sprache">
        <button id="langRU" data-lang="ru" lang="ru">RU</button><button id="langDE" data-lang="de" lang="de">DE</button>
      </div>
      <div class="clock" id="clock">--:--<small>:--</small></div>
      <div class="status"><span class="dot" id="dot"></span><span id="status"></span></div>
    </div>
  </header>

  <div class="controls">
    <label class="toggle"><input type="checkbox" id="hideMissed"> <span data-i18n="hideMissed"></span></label>
    <button class="icon-btn" id="refresh" data-i18n="refresh" data-i18n-title="refreshTitle"></button>
    <button class="icon-btn" id="theme" data-i18n-title="themeTitle">◐</button>
  </div>

  <section class="wx" id="wx">
    <div class="wx-tile wx-main"><span class="wx-ico" id="wxIco">·</span>
      <div><b id="wxTemp">–°</b><span id="wxDesc"></span></div></div>
    <div class="wx-tile"><span class="wx-k" data-i18n="wxRain"></span><b id="wxRain">–</b><span id="wxRainSub">&nbsp;</span></div>
    <div class="wx-tile"><span class="wx-k" data-i18n="wxToday"></span><b id="wxMinMax">–</b><span id="wxFeels">&nbsp;</span></div>
    <div class="wx-tile"><span class="wx-k" data-i18n="wxSun"></span><b id="wxSun">–</b><span id="wxSunSub">&nbsp;</span></div>
  </section>

  <div class="grid" id="grid"></div>

  <footer data-i18n="footer"></footer>
</div>

<script>
const HOME = { lat: 52.555928, lon: 13.437714 };
const STOPS = [
  { id: "900140009", name: "Hamburger Platz",                icon: "🚌", lat: null, lon: null, dist: 92 },
  { id: "900141506", name: "Am Steinberg",                   icon: "🚋", lat: null, lon: null, dist: 404 },
  { id: "900140017", name: "Gustav-Adolf-Str./Langhansstr.", icon: "🚋", lat: 52.553609, lon: 13.434729, exclude: ["156"] },
];
const APIS = ["https://v6.vbb.transport.rest", "https://v6.bvg.transport.rest"];
const DURATION = 45, RESULTS = 14, REFRESH_MS = 30000, DETOUR = 1.35;

// ---- Languages ----
const LINKS = `<a href="https://v6.vbb.transport.rest" target="_blank" rel="noopener">v6.vbb.transport.rest</a>`;
const OM = `<a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>`;
const I18N = {
  ru: {
    docTitle: "Отправления", title: "Отправления 🏠",
    sub: "13086 Берлин-Вайсензе · BVG/VBB в реальном времени · с учётом пути пешком",
    loading: "Загрузка…", updating: "Обновление…", live: s => `Онлайн · обновлено ${s} с назад`,
    hideMissed: "Скрыть, на что не успеть", refresh: "↻ Обновить", refreshTitle: "Обновить сейчас", themeTitle: "Светлая / тёмная тема",
    wxAria: "Погода", wxLoading: "Загрузка погоды…", wxNA: "Погода недоступна",
    wxRain: "Осадки", wxToday: "Сегодня", wxSun: "Солнце", mm: "мм",
    rainChance: n => `${n}% в ближайшие 3 ч`, rainNow: "сейчас",
    feels: (t, mm) => `ощущается ${t}° · ${mm} мм`,
    sunSetAt: t => `закат в ${t}`, sunRoseAt: t => `восход был в ${t}`, sunTomorrow: t => `завтра · сегодня закат ${t}`,
    cancelled: "отменён", missed: "не успеть", goNow: "Выходи!", goIn: n => `Выход: ${n}′`,
    now: "сейчас", onTime: "вовремя", platform: "платф.", walk: "🚶 пешком",
    empty: n => `Нет отправлений в ближайшие ${n} минут.`, stale: e => `⚠︎ Данные могут быть устаревшими (${e})`, error: "Ошибка",
    footer: `Время пешком оценено по прямой × 1,35 (поправка на маршрут) при обычном темпе. «Выход: N′» — через сколько минут нужно выйти из дома, чтобы успеть.
      Данные в реальном времени: ${LINKS} (HAFAS, BVG/VBB), обновление каждые 30 секунд. Погода: ${OM}.`,
    wmo: {0:"Ясно",1:"Преимущественно ясно",2:"Переменная облачность",3:"Пасмурно",45:"Туман",48:"Туман с изморозью",
      51:"Слабая морось",53:"Морось",55:"Сильная морось",56:"Ледяная морось",57:"Ледяная морось",
      61:"Небольшой дождь",63:"Дождь",65:"Сильный дождь",66:"Ледяной дождь",67:"Ледяной дождь",
      71:"Небольшой снег",73:"Снег",75:"Сильный снег",77:"Снежная крупа",
      80:"Ливень",81:"Ливень",82:"Сильный ливень",85:"Снегопад",86:"Сильный снегопад",
      95:"Гроза",96:"Гроза с градом",99:"Гроза с градом"},
  },
  de: {
    docTitle: "Abfahrten", title: "Abfahrten 🏠",
    sub: "13086 Berlin-Weißensee · Live-Daten von BVG/VBB · inkl. Fußweg",
    loading: "Lade…", updating: "Aktualisiere…", live: s => `Live · aktualisiert vor ${s}s`,
    hideMissed: "Nicht erreichbare ausblenden", refresh: "↻ Aktualisieren", refreshTitle: "Jetzt aktualisieren", themeTitle: "Hell / Dunkel",
    wxAria: "Wetter", wxLoading: "Wetter lädt…", wxNA: "Wetter nicht verfügbar",
    wxRain: "Niederschlag", wxToday: "Heute", wxSun: "Sonne", mm: "mm",
    rainChance: n => `${n}% in den nächsten 3 h`, rainNow: "jetzt",
    feels: (t, mm) => `gefühlt ${t}° · ${mm} mm heute`,
    sunSetAt: t => `Untergang ${t}`, sunRoseAt: t => `Aufgang war ${t}`, sunTomorrow: t => `morgen · heute ↓ ${t}`,
    cancelled: "fällt aus", missed: "verpasst", goNow: "Jetzt los!", goIn: n => `Los in ${n}′`,
    now: "jetzt", onTime: "pünktlich", platform: "Steig", walk: "🚶 zu Fuß",
    empty: n => `Keine Abfahrten in den nächsten ${n} Minuten.`, stale: e => `⚠︎ Daten evtl. veraltet (${e})`, error: "Fehler",
    footer: `Fußwege geschätzt aus Luftlinie × 1,35 (Umwegfaktor) bei normalem Gehtempo. „Los in“ = Minuten bis du losgehen musst, um die Abfahrt zu erreichen.
      Echtzeitdaten über ${LINKS} (HAFAS, BVG/VBB), Aktualisierung alle 30&nbsp;Sekunden. Wetter: ${OM}.`,
    wmo: {0:"Klar",1:"Überwiegend klar",2:"Teils bewölkt",3:"Bedeckt",45:"Nebel",48:"Reifnebel",
      51:"Leichter Niesel",53:"Niesel",55:"Starker Niesel",56:"Gefrierender Niesel",57:"Gefrierender Niesel",
      61:"Leichter Regen",63:"Regen",65:"Starker Regen",66:"Gefrierender Regen",67:"Gefrierender Regen",
      71:"Leichter Schnee",73:"Schnee",75:"Starker Schnee",77:"Schneegriesel",
      80:"Regenschauer",81:"Regenschauer",82:"Heftige Schauer",85:"Schneeschauer",86:"Schneeschauer",
      95:"Gewitter",96:"Gewitter mit Hagel",99:"Gewitter mit Hagel"},
  },
};
let lang = "ru";
try { const l = localStorage.getItem("lang"); if (I18N[l]) lang = l; } catch (e) {}
const T = () => I18N[lang];

function applyLang(){
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t[el.dataset.i18nTitle]; });
  document.getElementById("wx").setAttribute("aria-label", t.wxAria);
  document.querySelectorAll(".lang button").forEach(b => {
    const on = b.dataset.lang === lang;
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
  });
  if (!lastUpdate) statusEl.textContent = t.loading;
  renderWeather(); render();
}

const pace = 80;                     // m/min (normal walking pace)
let hideMissed = false;
const data = {};                     // stopId -> {deps, error}
try { hideMissed = localStorage.getItem("hideMissed") === "1"; } catch (e) {}

function haversine(a, b){
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLon = toR(b.lon - a.lon);
  const h = Math.pow(Math.sin(dLat/2), 2) + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.pow(Math.sin(dLon/2), 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}
function distOf(s){ return s.lat != null ? haversine(HOME, s) : s.dist; }
function walkMin(s){ return Math.max(1, Math.ceil(distOf(s) * DETOUR / pace)); }

async function fetchJSON(path){
  let lastErr;
  for (const base of APIS){
    try{
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
      const r = await fetch(base + path, { signal: ctl.signal }); clearTimeout(t);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

async function loadStop(s){
  try{
    const j = await fetchJSON(`/stops/${s.id}/departures?duration=${DURATION}&results=${RESULTS}&remarks=false&language=de`);
    const deps = (j.departures || j).filter(d => !(s.exclude || []).includes(d.line && d.line.name));
    const loc = deps[0] && deps[0].stop && deps[0].stop.location;
    if (loc && s.lat == null){ s.lat = loc.latitude; s.lon = loc.longitude; }
    data[s.id] = { deps, error: null };
  }catch(e){
    data[s.id] = { deps: (data[s.id] && data[s.id].deps) || [], error: e.message || T().error };
  }
}

const dot = document.getElementById("dot"), statusEl = document.getElementById("status");
let lastUpdate = null;
async function refresh(){
  statusEl.textContent = T().updating;
  await Promise.all(STOPS.map(loadStop));
  lastUpdate = new Date();
  const anyErr = STOPS.some(s => data[s.id] && data[s.id].error);
  dot.classList.toggle("err", anyErr);
  render();
}

function productOf(line){
  if (!line) return "bus";
  if (/^N\d/.test(line.name) && line.product === "bus") return "night";
  return line.product || "bus";
}
function badge(line, sm){
  const p = productOf(line);
  return `<span class="badge ${p === "night" ? "bus night" : p}${sm ? " sm" : ""}">${esc((line && line.name) || "?")}</span>`;
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hm(d){ return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); }
function cleanDir(d){ return (d || "").replace(/\s*\(Berlin\)\s*$/, "").replace(/^S\+U |^S |^U /, m => m); }

function enrich(dep, s, now){
  const when = new Date(dep.when || dep.plannedWhen);
  const planned = new Date(dep.plannedWhen || dep.when);
  const mins = (when - now) / 60000;
  const walk = walkMin(s);
  const leave = Math.floor(mins - walk);
  return { dep, s, when, planned, mins, walk, leave, missed: leave < 0, cancelled: !!dep.cancelled,
           delay: dep.delay != null ? Math.round(dep.delay / 60) : null };
}

function leavePill(e){
  const t = T();
  if (e.cancelled) return `<span class="pill">${t.cancelled}</span>`;
  if (e.missed) return `<span class="pill">${t.missed}</span>`;
  if (e.leave <= 0) return `<span class="pill now">${t.goNow}</span>`;
  if (e.leave <= 3) return `<span class="pill soon">${t.goIn(e.leave)}</span>`;
  return `<span class="pill ok">${t.goIn(e.leave)}</span>`;
}
function minsLabel(e){
  const m = Math.floor(e.mins);
  return m <= 0 ? T().now : `${m}′`;
}
function delayLabel(e){
  const pt = `<span class="pt">${hm(e.planned)}</span>`;
  if (e.delay == null) return `<span class="c">${pt}</span>`;
  if (e.delay > 0) return `<span class="c">${pt} <span class="late">+${e.delay}</span></span>`;
  if (e.delay < 0) return `<span class="c">${pt} <span class="late">${e.delay}</span></span>`;
  return `<span class="c">${pt} <span class="ontime">${T().onTime}</span></span>`;
}

function render(){
  const now = new Date();
  const grid = document.getElementById("grid");
  const all = [];

  grid.innerHTML = STOPS.map(s => {
    const d = data[s.id];
    const walk = walkMin(s);
    const dist = Math.round(distOf(s) * DETOUR);
    const lineMap = new Map();
    let rows = "";
    if (!d){
      rows = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
    } else {
      const items = d.deps.map(x => enrich(x, s, now)).filter(e => e.mins > -1).sort((a, b) => a.when - b.when);
      items.forEach(e => { lineMap.set(e.dep.line && e.dep.line.name, e.dep.line); all.push(e); });
      const shown = items.filter(e => !(hideMissed && e.missed)).slice(0, 9);
      rows = shown.length ? `<table>${shown.map(e => `
        <tr class="${e.missed ? "missed" : ""} ${e.cancelled ? "cancel" : ""}">
          <td class="l">${badge(e.dep.line)}</td>
          <td class="d"><div class="t">${esc(cleanDir(e.dep.direction))}</div>
            <div class="s">${hm(e.when)}${e.dep.platform ? " · " + T().platform + " " + esc(e.dep.platform) : ""}</div></td>
          <td class="m"><b>${minsLabel(e)}</b>${delayLabel(e)}</td>
          <td class="lv">${leavePill(e)}</td>
        </tr>`).join("")}</table>`
        : `<div class="empty">${T().empty(DURATION)}</div>`;
      if (d.error) rows += `<div class="err">${esc(T().stale(d.error))}</div>`;
    }
    const lines = [...lineMap.values()].sort((a, b) => ((a && a.name) || "").localeCompare((b && b.name) || "", "de", { numeric: true }));
    return `<article class="card">
      <div class="card-head">
        <div><h3>${esc(s.name)} ${s.icon || ""}</h3><div class="lines">${lines.map(l => badge(l, true)).join("")}</div></div>
        <div class="walk"><b>${walk}′</b><span>${T().walk}</span><small>~${dist} m</small></div>
      </div>${rows}</article>`;
  }).join("");

  if (lastUpdate){
    const ago = Math.round((now - lastUpdate) / 1000);
    statusEl.textContent = T().live(ago);
  }
}

function tick(){
  const n = new Date();
  const p = x => String(x).padStart(2, "0");
  document.getElementById("clock").innerHTML = `${p(n.getHours())}:${p(n.getMinutes())}<small>:${p(n.getSeconds())}</small>`;
}

// controls
const hm_ = document.getElementById("hideMissed");
hm_.checked = hideMissed;
hm_.onchange = () => { hideMissed = hm_.checked; try { localStorage.setItem("hideMissed", hideMissed ? "1" : "0"); } catch (e) {} render(); };
document.getElementById("refresh").onclick = refresh;
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyLang();
});
document.getElementById("theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", r.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

// ---- Weather (Open-Meteo, no key needed) ----
const WX_ICON = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",56:"🌧️",57:"🌧️",
  61:"🌧️",63:"🌧️",65:"🌧️",66:"🌧️",67:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",77:"🌨️",
  80:"🌦️",81:"🌧️",82:"⛈️",85:"🌨️",86:"🌨️",95:"⛈️",96:"⛈️",99:"⛈️"};
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString(lang === "ru" ? "ru-RU" : "de-DE");
const hhmm = iso => iso ? iso.slice(11, 16) : "–";
let weather = null, weatherFailed = false;
const $ = id => document.getElementById(id);
async function loadWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${HOME.lat}&longitude=${HOME.lon}`
    + `&current=temperature_2m,apparent_temperature,precipitation,weather_code,is_day`
    + `&hourly=precipitation_probability,precipitation`
    + `&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,precipitation_sum`
    + `&timezone=Europe%2FBerlin&forecast_days=2`;
  try{
    const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status);
    weather = await r.json(); weatherFailed = false;
  }catch(e){ weatherFailed = true; }
  renderWeather();
}
function renderWeather(){
  const t = T();
  if (!weather){ $("wxDesc").textContent = weatherFailed ? t.wxNA : t.wxLoading; return; }
  const w = weather, c = w.current, d = w.daily;
  $("wxIco").textContent = (c.is_day === 0 && c.weather_code <= 1) ? "🌙" : (WX_ICON[c.weather_code] || "🌡️");
  $("wxTemp").textContent = `${Math.round(c.temperature_2m)}°`;
  $("wxDesc").textContent = t.wmo[c.weather_code] || "—";
  // precipitation: now + chance over the next 3 hours
  const i0 = w.hourly.time.findIndex(x => x.slice(0, 13) === c.time.slice(0, 13));
  const next = i0 >= 0 ? w.hourly.precipitation_probability.slice(i0, i0 + 3) : [];
  const chance = next.length ? Math.max(...next) : null;
  $("wxRain").textContent = `${fmt1(c.precipitation)} ${t.mm}`;
  $("wxRainSub").textContent = chance != null ? t.rainChance(chance) : t.rainNow;
  $("wxMinMax").textContent = `${Math.round(d.temperature_2m_min[0])}° / ${Math.round(d.temperature_2m_max[0])}°`;
  $("wxFeels").textContent = t.feels(Math.round(c.apparent_temperature), fmt1(d.precipitation_sum[0]));
  // sun: show the next event first
  const nowIso = c.time, rise = d.sunrise[0], set = d.sunset[0];
  let main, sub;
  if (nowIso < rise){ main = `↑ ${hhmm(rise)}`; sub = t.sunSetAt(hhmm(set)); }
  else if (nowIso < set){ main = `↓ ${hhmm(set)}`; sub = t.sunRoseAt(hhmm(rise)); }
  else { main = `↑ ${hhmm(d.sunrise[1])}`; sub = t.sunTomorrow(hhmm(set)); }
  $("wxSun").textContent = main;
  $("wxSunSub").textContent = sub;
}

loadWeather(); setInterval(loadWeather, 15 * 60000);
tick(); applyLang(); refresh();
setInterval(tick, 1000);
setInterval(render, 5000);
setInterval(refresh, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
